# Copy this file into a separate Hermes profile. Supply SUPER_API_KEY through its environment.
providers:
  tokenfactory-super:
    api: https://api.tokenfactory.nebius.com/v1
    key_env: SUPER_API_KEY
    transport: chat_completions
    default_model: nvidia/Nemotron-3.5-Super-VL

model:
  provider: custom:tokenfactory-super
  default: nvidia/Nemotron-3.5-Super-VL
  supports_vision: true

model_overrides:
  "custom:tokenfactory-super":
    "nvidia/Nemotron-3.5-Super-VL":
      supports_tools: true
      supports_vision: true

# Hermes defers plugin tools behind tool_search by default. Load the team tools directly.
tools:
  tool_search:
    enabled: "off"

agent:
  coding_context: "off"
  # Attach --image files to the user turn for the vision model.
  image_input_mode: native
